name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;35.0.0'
          python -m pip install --disable-pip-version-check ziglang==0.13.0
          python -c 'import os, pathlib, ziglang; print("CARROT_ZIG=" + str(pathlib.Path(ziglang.__file__).parent / "zig"))' >> "$GITHUB_ENV"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python ci/release_notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('KEYSTORE_BASE64', '').strip()
          if not value:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 repository secret')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'suite.keystore'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ANDROID_KEYSTORE=' + str(key) + '\n')
          PY
      - name: Build signed APK
        env:
          ANDROID_APK_NAME: bwlb-hook.apk
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || 'suite' }}
          ANDROID_REQUIRE_RELEASE_KEY: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: python build_apk.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bwlb-hook-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
      - name: Remove signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f -- "$RUNNER_TEMP/suite.keystore"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bwlb-hook-apk
          path: dist
      - name: Prepare release notes
        run: python ci/release_notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --title "保卫萝卜合集 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 --verify-tag --title "保卫萝卜合集 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
